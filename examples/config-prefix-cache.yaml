# ==============================================================================
# Hermes Agent — config-prefix-cache.yaml
# Strategy: BALANCED + Prefix Cache Optimized (prinsip dari DeepSeek Reasonix)
#
# Cocok untuk: heavy daily use, banyak session panjang, mau squeeze savings max
# Cost estimasi: ~$8-12/bulan (lebih hemat dari balanced standard)
#
# Konsep:
#   DeepSeek API otomatis cache prefix (system prompt) ke disk.
#   Cache hit = 10x lebih murah dari normal input token.
#   Untuk cache hit konsisten, prefix (SOUL.md + tools + skills) HARUS stabil.
#   Config ini menjaga prefix tetap stabil selama mungkin.
#
# Sumber: https://api-docs.deepseek.com/guides/kv_cache
#         https://github.com/esengine/DeepSeek-Reasonix (prinsip)
# ==============================================================================

# ------------------------------------------------------------------------------
# PRIMARY MODEL — Kimi K2.6 (near-Opus quality)
# ------------------------------------------------------------------------------
model:
  provider: opencode-go
  default: kimi-k2.6

# ------------------------------------------------------------------------------
# FALLBACK
# ------------------------------------------------------------------------------
fallback_model:
  provider: opencode-go
  model: deepseek-v4-flash

# ------------------------------------------------------------------------------
# SMART MODEL ROUTING
# ------------------------------------------------------------------------------
smart_model_routing:
  enabled: true
  max_simple_chars: 160
  max_simple_words: 28
  cheap_model:
    provider: opencode-go
    model: deepseek-v4-flash

# ------------------------------------------------------------------------------
# REASONING EFFORT
# ------------------------------------------------------------------------------
agent:
  reasoning_effort: ""           # medium (default)
  max_turns: 90

# ------------------------------------------------------------------------------
# AUXILIARY MODELS
# ------------------------------------------------------------------------------
auxiliary:
  vision:
    provider: openrouter
    model: google/gemini-2.5-flash
    timeout: 30
  web_extract:
    provider: opencode-go
    model: qwen3.5-plus
  approval:
    provider: opencode-go
    model: deepseek-v4-flash

# ------------------------------------------------------------------------------
# COMPRESSION — KEY SETTING untuk prefix cache
# ------------------------------------------------------------------------------
# NAIKAN threshold vs default (0.50 → 0.65)
#
# Kenapa:
#   Setiap kali compression terjadi, conversation history di-compress →
#   format berubah → cache miss untuk history portion.
#   Dengan threshold lebih tinggi, compression lebih jarang → cache hit rate naik.
#
# Trade-off:
#   Session sedikit lebih panjang sebelum compress → sedikit lebih mahal per session,
#   tapi saving dari cache hit jauh lebih besar.
#
# Math: system prompt 4000 token × 40 turns:
#   Normal:   160,000 token input @ $0.07/M = $0.011
#   Cached:   4000 (first) + 156,000 @ cache hit price = ~$0.001
#   Saving:   ~91% untuk sistem prompt portion
compression:
  enabled: true
  threshold: 0.65                # ← KEY: lebih tinggi dari default 0.50
  summary_provider: opencode-go
  summary_model: qwen3.5-plus

# ------------------------------------------------------------------------------
# DELEGATION
# ------------------------------------------------------------------------------
delegation:
  provider: opencode-go
  model: qwen3.6-plus

# ------------------------------------------------------------------------------
# MEMORY — KETAT untuk jaga prefix stabil
# ------------------------------------------------------------------------------
# Memory yang lebih pendek = bagian "semi-stabil" prefix lebih kecil →
# cache hit untuk system prompt portion lebih konsisten.
#
# Kapan memory prefix berubah: saat lo save memory baru via Hermes.
# Makin ketat memory limit → makin sedikit perubahan → lebih cache-friendly.
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 1500        # ← lebih ketat dari default 2200
  user_char_limit: 1000          # ← lebih ketat dari default 1375

# ------------------------------------------------------------------------------
# WEB SEARCH BACKEND
# ------------------------------------------------------------------------------
web:
  backend: firecrawl

# ------------------------------------------------------------------------------
# TERMINAL
# ------------------------------------------------------------------------------
terminal:
  backend: local
  cwd: "."
  timeout: 180
  persistent_shell: true

# ------------------------------------------------------------------------------
# APPROVALS
# ------------------------------------------------------------------------------
approvals:
  mode: manual

# ------------------------------------------------------------------------------
# CHECKPOINTS
# ------------------------------------------------------------------------------
checkpoints:
  enabled: true
  max_snapshots: 50

# ------------------------------------------------------------------------------
# DISPLAY
# ------------------------------------------------------------------------------
display:
  tool_progress: all
  compact: false
  show_cost: true                # WAJIB ON untuk monitor cache savings
  bell_on_complete: true
  show_reasoning: false

# ------------------------------------------------------------------------------
# QUICK COMMANDS
# ------------------------------------------------------------------------------
quick_commands:
  status:
    type: exec
    command: systemctl status hermes-agent.service 2>/dev/null || echo "Service not found"
  disk:
    type: exec
    command: df -h /
  uptime:
    type: exec
    command: uptime
  hermes_update:
    type: exec
    command: hermes update

# ------------------------------------------------------------------------------
# STREAMING
# ------------------------------------------------------------------------------
streaming:
  enabled: true
  transport: edit
  edit_interval: 0.3
  buffer_threshold: 40

# ------------------------------------------------------------------------------
# PRIVACY
# ------------------------------------------------------------------------------
privacy:
  redact_pii: false

# ------------------------------------------------------------------------------
# GROUP CHAT
# ------------------------------------------------------------------------------
group_sessions_per_user: true

# ==============================================================================
# NOTES untuk PREFIX-CACHE OPTIMIZED strategy:
#
# 1. SOUL.md HARUS STATIC (tidak ada {datetime}, {user}, {random}):
#    → Tiap perubahan SOUL.md = cache bust = 1-2 turn pertama bayar full
#    → Edit SOUL.md seminimal mungkin, hanya kalau benar-benar perlu
#
# 2. Cara verifikasi cache sedang hit:
#    → Aktifkan show_cost: true
#    → Turn ke-1: biaya normal (cache miss, pertama kali)
#    → Turn ke-2+: biaya jauh lebih rendah = cache hit
#    → Kalau semua turn sama mahal → ada sesuatu yang dynamic di prefix
#
# 3. Urutan konten yang optimal (statis dulu, dinamis belakangan):
#    SOUL.md → Tools → Skills → Memory → Conversation history → User message
#    DeepSeek cache dari kiri ke kanan.
#
# 4. Jangan sering /compress:
#    → Setiap /compress mengubah conversation format → cache miss untuk history
#    → Dengan threshold 0.65, ini terjadi lebih jarang
#
# 5. Reasonix vs Hermes:
#    Reasonix adalah agent terpisah yang dibangun khusus untuk prefix cache.
#    Config ini mengadopsi PRINSIPNYA di Hermes. Tidak perlu install Reasonix.
#    Hermes punya Skills, Memory, Telegram, Multi-profile yang Reasonix tidak punya.
#
# Dokumentasi lengkap: docs/14-prefix-cache-optimization.md
# ==============================================================================
