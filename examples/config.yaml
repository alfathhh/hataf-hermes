# ==============================================================================
# Hermes Agent — config.yaml (BALANCED strategy, OpenCode Go only)
# Lokasi: ~/.hermes/config.yaml
#
# Strategy: Kimi K2.6 (top quality) sebagai primary, DeepSeek V4 Flash (paling
# irit) untuk smart routing + auxiliary. Total ~$11-13/bulan.
#
# Aturan: secrets (API key, token) MASUK KE .env. File ini cuma settings.
# ==============================================================================

# ------------------------------------------------------------------------------
# MODEL — primary (Kimi K2.6, top tier di OpenCode Go bundle)
# ------------------------------------------------------------------------------
# Kimi K2.6: SWE-Bench Pro 58.6% — near Opus level.
# Quota: 1,150 credits (terbatas). Smart routing WAJIB ON biar gak boros.
model:
  provider: opencode-go
  default: kimi-k2.6
  api_mode: chat_completions

# ------------------------------------------------------------------------------
# FALLBACK MODEL — kalau K2.6 rate limit / error
# ------------------------------------------------------------------------------
# DeepSeek V4 Pro: strong model, quota 3,450 (lebih longgar dari K2.6).
# Auto-switch kalau primary gagal. Conversation gak putus.
fallback_model:
  provider: opencode-go
  model: deepseek-v4-pro

# ------------------------------------------------------------------------------
# SMART MODEL ROUTING — turn pendek/sederhana → cheap model (WAJIB ON)
# ------------------------------------------------------------------------------
# Ini yang BIKIN lo hemat. 60-70% turn lo (halo, quick Q&A, translate, format)
# ke DeepSeek V4 Flash (31,650 credits = PALING IRIT).
# Cuma turn kompleks (coding, debug, analysis) yang ke primary K2.6.
smart_model_routing:
  enabled: true
  max_simple_chars: 160         # < 160 karakter → cheap
  max_simple_words: 28          # < 28 kata → cheap
  cheap_model:
    provider: opencode-go
    model: deepseek-v4-flash    # 31,650 credits = paling irit di bundle

# ------------------------------------------------------------------------------
# AUXILIARY MODELS — task ringan di belakang layar
# ------------------------------------------------------------------------------
# Vision: HARUS dari OpenRouter (model OpenCode Go gak ada yang vision-capable)
# Web extract & approval: model murah dari OpenCode Go, cukup adequate
auxiliary:
  vision:
    provider: openrouter
    model: google/gemini-2.5-flash
    timeout: 30
  web_extract:
    provider: opencode-go
    model: qwen3.5-plus           # 10,200 credits, adequate buat extract teks
  approval:
    provider: opencode-go
    model: deepseek-v4-flash      # 31,650 credits, binary classify doang
  compression:
    provider: opencode-go
    model: deepseek-v4-flash      # model paling irit untuk summarize history

# ------------------------------------------------------------------------------
# CONTEXT COMPRESSION — kompres conversation lama otomatis
# ------------------------------------------------------------------------------
# Model untuk summarize diatur via auxiliary.compression di atas.
# Task-nya cuma summarize, gak perlu pinter.
compression:
  enabled: true
  threshold: 0.50                 # compress saat 50% context penuh
  target_ratio: 0.2
  protect_last_n: 20

# ------------------------------------------------------------------------------
# REASONING EFFORT — default medium. Naikkan kalau butuh deep thinking.
# ------------------------------------------------------------------------------
agent:
  reasoning_effort: ""            # kosong = medium. opsi: xhigh/high/medium/low/minimal/none
  max_turns: 90                   # max iteration per turn

# ------------------------------------------------------------------------------
# DELEGATION — subagent pakai model balance (bukan primary, bukan paling murah)
# ------------------------------------------------------------------------------
# Qwen3.6 Plus: 3,300 credits. Good balance quality/cost buat narrow subtask.
delegation:
  provider: opencode-go
  model: qwen3.6-plus

# ------------------------------------------------------------------------------
# MEMORY — limit konservatif, biar system prompt tetap kecil
# ------------------------------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200         # ~800 tokens
  user_char_limit: 1375           # ~500 tokens

# ------------------------------------------------------------------------------
# WEB SEARCH BACKEND — default: firecrawl (paling lengkap)
# ------------------------------------------------------------------------------
web:
  backend: firecrawl              # opsi: firecrawl | parallel | tavily

# ------------------------------------------------------------------------------
# TERMINAL BACKEND — default: local
# ------------------------------------------------------------------------------
terminal:
  backend: local
  cwd: "."
  timeout: 180
  persistent_shell: true

# ------------------------------------------------------------------------------
# APPROVALS — kontrol command bahaya
# ------------------------------------------------------------------------------
approvals:
  mode: manual                    # manual | smart | off

# ------------------------------------------------------------------------------
# CHECKPOINTS — snapshot otomatis sebelum operasi destruktif
# ------------------------------------------------------------------------------
checkpoints:
  enabled: true
  max_snapshots: 50

# ------------------------------------------------------------------------------
# DISPLAY — TUI behavior
# ------------------------------------------------------------------------------
display:
  tool_progress: all
  compact: false
  show_cost: true                 # tampilkan estimasi $ di status bar
  bell_on_complete: true
  show_reasoning: false

# ------------------------------------------------------------------------------
# QUICK COMMANDS — shell shortcut tanpa LLM (zero token)
# ------------------------------------------------------------------------------
quick_commands:
  status:
    type: exec
    command: systemctl status hermes-agent.service 2>/dev/null || echo "Service not found"
  disk:
    type: exec
    command: df -h /
  uptime:
    type: exec
    command: uptime
  hermes_update:
    type: exec
    command: hermes update

# ------------------------------------------------------------------------------
# STREAMING — token stream ke Telegram
# ------------------------------------------------------------------------------
streaming:
  enabled: true

# ------------------------------------------------------------------------------
# PRIVACY
# ------------------------------------------------------------------------------
privacy:
  redact_pii: false

# ------------------------------------------------------------------------------
# UNAUTHORIZED DM BEHAVIOR
# ------------------------------------------------------------------------------
unauthorized_dm_behavior: pair

# ------------------------------------------------------------------------------
# GROUP CHAT — sesi per user (recommended)
# ------------------------------------------------------------------------------
group_sessions_per_user: true
